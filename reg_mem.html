<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 게시판 프로젝트</title>
    <link rel="stylesheet" href="table.css">
</head>
<body>
    <div class="container" style="text-align: center; margin-top: 50px;">
        <header>
            <h1>회원가입</h1>
        </header>

        <form name="reg" action="reg_member.php" method="post">
            <table class="t" style="margin: 0 auto;">
                <tr>
                    <th><label for="userid">아이디</label></th>
                    <td>
                        <input type="text" id="userid" name="userid" placeholder="사용할 ID 입력" required autofocus>
                    </td>
                </tr>
                <tr>
                    <th><label for="passwd">비밀번호</label></th>
                    <td>
                        <input type="password" id="passwd" name="passwd" placeholder="비밀번호 입력" required>
                    </td>
                </tr>
                <tr>
                    <th><label for="name">이름</label></th>
                    <td>
                        <input type="text" id="name" name="name" placeholder="실명 입력" required>
                    </td>
                </tr>
                <tr>
                    <th><label for="email">이메일</label></th>
                    <td>
                        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                    </td> 
                </tr>
            </table>

            <div class="btn-group" style="margin-top: 20px;">
                <button type="submit" class="b2">가입하기</button>
                <button type="button" class="b2" onclick="location.href='login.html'">취소</button>
            </div>
        </form>
    </div>
</body>
</html>
