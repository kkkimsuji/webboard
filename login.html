<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 게시판</title>
    <link rel="stylesheet" href="table.css"> 
</head>
<body>
    <div class="login-container" style="text-align: center; margin-top: 100px;">
        <header>
            <h1>로그인</h1>
        </header>

        <form name="login" action="login.php" method="post">
            <table class="login-table" style="margin: 0 auto;">
                <tr>
                    <th><label for="userid">아이디</label></th>
                    <td>
                        <input type="text" id="userid" name="userid" placeholder="ID를 입력하세요" required autofocus>
                    </td>
                    <td rowspan="2">
                        <button type="submit" class="b1">로그인</button>
                    </td>
                </tr>
                <tr>
                    <th><label for="passwd">비밀번호</label></th>
                    <td>
                        <input type="password" id="passwd" name="passwd" placeholder="Password" required>
                    </td>
                </tr>
            </table>
            
            <footer style="margin-top: 20px;">
                <p>아직 회원이 아니십니까? <a href="reg_member.html">회원가입</a></p>
            </footer>
        </form>
    </div>
</body>
</html>
